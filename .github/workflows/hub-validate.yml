# hub-validate -- 公開前の必須検査と、それを通ったときだけ行う公開。
#
# ローカルの pre-commit フックは早期警告にすぎない（--no-verify、フック未導入の
# 端末、別 GUI クライアント、clone し直しで回避できる）。複数デバイスで運用する
# 以上、最終的な歯止めはここに置く。
#
# 2026-08-03: Pages の配信を「main ブランチを直接配信」から、この workflow の
# deploy job 経由へ変更した。従来は main へ push した時点で配信対象になり、
# 検査が赤くなっても手遅れだった（＝検査が事後検知でしかなかった）。
# deploy を hub-validate の成功に依存させることで、PR を必須にしなくても
# 「検査を通ったものだけが公開される」を維持できる。
#
# ブランチ保護の required status check にはこの job 名 `hub-validate` を指定する。
# paths フィルターは付けない（付けると対象外 PR で check が発行されず、
# required check が永久に pending になる）。

name: hub-validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 公開まで含むので、同時実行を許さず後勝ちにする（cancel-in-progress は付けない。
  # deploy 途中で打ち切ると中途半端な状態で配信されうるため）。
  group: hub-pages

jobs:
  hub-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ガード自身が「何も検出しない状態」に退化していないか。
      # 対象が清浄だと他の検査は緑になってしまうため、これを最初に置く。
      - name: ガードの自己テスト
        run: python3 _tools/test_guards.py

      # SharePoint がドキュメントライブラリ上の HTML に書き込む列メタデータ
      # （<title> の空化・mso ブロック）が混入していないか。2026-08-02 の
      # インシデントで、これだけが正本自体の破損を検知できる検査だった。
      - name: SharePoint 汚染検査
        run: python3 _tools/check-contamination.py --all

      # 共通ヘッダー・計測タグが全ページへ反映済みか（_partials との差分ゼロ）
      - name: 共通パーツの反映確認
        run: python3 _partials/inject.py --check

      # 新規ページの載せ忘れ・削除済み URL の残置を防ぐ
      - name: sitemap の整合確認
        run: python3 _tools/gen-sitemap.py --check

      # CNAME 等、消えると公開が壊れるものが消えていないか
      - name: 不変条件の確認
        run: python3 _tools/check-invariants.py

      # 生成物がコミット漏れなく最新か（上の各 --check を通っていれば差分は出ない）
      - name: 作業ツリーに差分が残っていないこと
        run: git diff --exit-code

  build:
    # 検査を通らなければビルドしない＝公開物が作られない。
    needs: hub-validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 従来と同じ Jekyll ビルド。_partials/ _tools/ など "_" 始まりが成果物から
      # 除外される挙動は、これに依存している（本番で 404 になることを確認済み）。
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      # Jekyll ビルダーは CNAME を成果物へ入れない（2026-08-03 の実行で確認。
      # `_site` 直下に CNAME が無かった）。Actions 配信では成果物に CNAME が
      # 無いと独自ドメインの設定が外れうるため、明示的に置く。
      # `_config.yml` の include で対応する手もあるが、現在の本番はまだ
      # ブランチ配信なので、そちらのビルド挙動を変えない方法を採る。
      - name: CNAME を成果物へ
        run: |
          # jekyll-build-pages はコンテナ内で root として動くため、生成された
          # _site はランナーのユーザーでは書き込めない（2026-08-03 に cp が
          # exit 1 で失敗して判明）。所有権を移してから置く。
          echo "before: $(ls -ld _site)"
          sudo chown -R "$(id -u):$(id -g)" _site
          echo "after : $(ls -ld _site)"
          cp CNAME _site/CNAME
          echo "::notice::CNAME を成果物へ配置: $(cat _site/CNAME)"
      # 公開してはいけないものが成果物に混ざっていないかを、配信前に確認する。
      # 失敗時に原因が分かるよう、判定の前に中身を必ず出す（ログは認証が無いと
      # 外から読めないため、後から追えるようにしておく）。
      - name: 成果物の確認
        run: |
          echo "===== _site 直下 ====="
          ls -la _site || { echo "_site が生成されていない"; exit 1; }
          echo "===== 判定 ====="
          # 判定結果は ::error:: / ::notice:: でも出す。Actions のログ本体は
          # 認証が無いと外部から読めないが、注釈は public API で取得できるため、
          # 失敗原因をブラウザを開かずに追える。
          fail=0
          for p in _partials _tools; do
            if [ -e "_site/$p" ]; then
              echo "::error::成果物に $p が含まれている（非公開のはず）"; fail=1
            else
              echo "OK  $p は除外されている"
            fi
          done
          for f in CNAME sitemap.xml index.html robots.txt; do
            if [ -f "_site/$f" ]; then
              echo "OK  $f あり"
            else
              echo "::error::成果物に $f が無い"; fail=1
            fi
          done
          echo "::notice::_site 直下= $(ls _site | tr '\n' ' ') / HTML $(find _site -name '*.html' | wc -l) 件 / CNAME=$(cat _site/CNAME 2>/dev/null || echo 'なし')"
          exit $fail
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 公開権限はこの job だけに与える。
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
