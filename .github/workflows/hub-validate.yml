# hub-validate -- 公開前の必須検査と、それを通ったときだけ行う公開。
#
# ローカルの pre-commit フックは早期警告にすぎない（--no-verify、フック未導入の
# 端末、別 GUI クライアント、clone し直しで回避できる）。複数デバイスで運用する
# 以上、最終的な歯止めはここに置く。
#
# 2026-08-03: Pages の配信を「main ブランチを直接配信」から、この workflow の
# deploy job 経由へ変更した。従来は main へ push した時点で配信対象になり、
# 検査が赤くなっても手遅れだった（＝検査が事後検知でしかなかった）。
# deploy を hub-validate の成功に依存させることで、PR を必須にしなくても
# 「検査を通ったものだけが公開される」を維持できる。
#
# ブランチ保護の required status check にはこの job 名 `hub-validate` を指定する。
# paths フィルターは付けない（付けると対象外 PR で check が発行されず、
# required check が永久に pending になる）。

name: hub-validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 公開まで含むので、同時実行を許さず後勝ちにする（cancel-in-progress は付けない。
  # deploy 途中で打ち切ると中途半端な状態で配信されうるため）。
  group: hub-pages

jobs:
  hub-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # ガード自身が「何も検出しない状態」に退化していないか。
      # 対象が清浄だと他の検査は緑になってしまうため、これを最初に置く。
      - name: ガードの自己テスト
        run: python3 _tools/test_guards.py

      # SharePoint がドキュメントライブラリ上の HTML に書き込む列メタデータ
      # （<title> の空化・mso ブロック）が混入していないか。2026-08-02 の
      # インシデントで、これだけが正本自体の破損を検知できる検査だった。
      - name: SharePoint 汚染検査
        run: python3 _tools/check-contamination.py --all

      # 共通ヘッダー・計測タグが全ページへ反映済みか（_partials との差分ゼロ）
      - name: 共通パーツの反映確認
        run: python3 _partials/inject.py --check

      # 新規ページの載せ忘れ・削除済み URL の残置を防ぐ
      - name: sitemap の整合確認
        run: python3 _tools/gen-sitemap.py --check

      # CNAME 等、消えると公開が壊れるものが消えていないか
      - name: 不変条件の確認
        run: python3 _tools/check-invariants.py

      # 生成物がコミット漏れなく最新か（上の各 --check を通っていれば差分は出ない）
      - name: 作業ツリーに差分が残っていないこと
        run: git diff --exit-code

  build:
    # 検査を通らなければビルドしない＝公開物が作られない。
    needs: hub-validate
    # PR や作業ブランチでも成果物を検証する。ここを main 限定にしていたため、
    # 直すたびに main で試すしかなく、3 回続けて main の実行を赤くした。
    # 公開の制限は deploy job 側だけに置く。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: pages
        uses: actions/configure-pages@v5

      # 独自ドメインの正本は「リポジトリ設定の Custom domain」であって、
      # 成果物の CNAME ファイルではない。GitHub は Actions 配信について
      # "any CNAME file is ignored and is not required" と明記している。
      # そこで成果物ではなく設定そのものを配信前に確認する。
      - name: Pages の独自ドメイン設定を確認
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        run: |
          echo "::notice::Pages host = ${PAGES_HOST:-（空）}"
          if [ "$PAGES_HOST" != "hub.zotac.co.jp" ]; then
            echo "::error::Pages の Custom domain が想定外です: ${PAGES_HOST:-（空）}"
            exit 1
          fi

      # Jekyll は使わない。テンプレート機能（front matter / Liquid）を一切
      # 使っておらず、"_ 始まりを除外する" という一点のためだけに Ruby・gem・
      # Docker action へ依存していた。その依存が今回の失敗の原因でもある
      # （成果物が root 所有で書き込めない／CNAME が入らない）。
      # 除外規則は Jekyll の慣習に任せず、ここで明示する。
      - name: 公開成果物を作成
        run: |
          mkdir -p _site
          # "*" は dotfile に一致しないので .github/.gitignore 等は自動的に除外。
          # 加えて "_" 始まり（_partials, _tools）と、サイトの一部ではないものを除く。
          # README.md / CLAUDE.md はリポジトリの説明・作業入口であってページでは
          # ない（サイトのルートに置く必要がなく、運用手順が閲覧できる状態に
          # する理由もない）。
          for e in *; do
            case "$e" in
              _*|CNAME|README.md|CLAUDE.md|_site) continue ;;
            esac
            cp -a -- "$e" _site/
          done

      - name: 成果物を確認
        run: |
          fail=0
          for p in _partials _tools .github .git CNAME README.md CLAUDE.md; do
            if [ -e "_site/$p" ]; then
              echo "::error::成果物に $p が含まれている（公開してはいけない）"; fail=1
            fi
          done
          for f in index.html sitemap.xml robots.txt favicon.ico google2a4e44ce4ec33d4a.html; do
            if [ ! -f "_site/$f" ]; then
              echo "::error::成果物に $f が無い"; fail=1
            fi
          done
          echo "::notice::_site 直下= $(ls _site | tr '\n' ' ')"
          echo "::notice::HTML= $(find _site -type f -name '*.html' | wc -l) 件"
          exit "$fail"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 公開権限はこの job だけに与える。
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
